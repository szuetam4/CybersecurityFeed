<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CybersecurityFeed - znajdziesz tutaj wszystkie wyszukane przez nas artykuły i media dotyczące nowości na temat Cyberbezpieczeństwa!">
    <title>CybersecurityFeed</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="#" class="logo">Cybersecurity<span>Feed</span></a>
        <div style="font-weight: 600; color: var(--text-muted);">
            Najnowsze Wiadomości
        </div>
    </header>

    <main>
        <div class="section-header">
            <h1>Aktualności</h1>
        </div>
        <div class="tool-bar">
            <div class="filter-group">
                <label for="category-filter">Wybierz kategorie:</label>
                <select id="category-filter">
                    <option value="">Wszystko</option>
                </select>
            </div>
            <button id="sort-toggle">Rosnąco</button>
        </div>
        <div class="feed-container" id="news-feed">
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
